<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Fortune</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="header-content">
    <h1>DIGITAL FORTUNE COOKIE</h1>
    <nav>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="how-it-works.html">HOW IT WORKS</a></li>
        <li><a href="submit.html">SUBMIT</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="page-content submit-section">
    <h2>SUBMIT A FORTUNE</h2>

    <p>
      Contribute your own quote from a movie, book, or song.  
      Submitted fortunes will appear randomly for you on this device.
    </p>

    <form id="submitForm" class="submit-form">
      <input
        type="text"
        id="userQuote"
        placeholder="Quote"
        required
      >

      <input
        type="text"
        id="userTitle"
        placeholder="Movie / Book / Song Title"
        required
      >

      <select id="userCategory" required>
        <option value="Movie">Movie</option>
        <option value="Book">Book</option>
        <option value="Music">Music</option>
      </select>

      <textarea
        id="userDescription"
        placeholder="One-sentence synopsis"
        required
      ></textarea>

      <button type="submit" class="cat-btn">
        ADD FORTUNE
      </button>
    </form>

    <p id="submitMsg"></p>
  </section>
</main>

<footer>
  <p>kissa ©</p>
</footer>

<script src="script.js"></script>
</body>
</html>
